<!doctype html>
<meta charset="utf-8">
<title>Herdr native browser acceptance fixture</title>
<style>body{font:18px sans-serif;margin:24px;background:#f0f7ff}input,button{font:inherit;padding:8px}#scroll-marker{margin-top:1300px;background:#ffc;padding:24px}</style>
<h1 id="inspect-me">Real workspace-host Chromium</h1>
<p>Native Stage A fixture. Every marker below is generated by this live page.</p>
<label>Unsent draft <input id="draft" placeholder="type a draft; hide and reattach"></label>
<p id="memory"></p><p id="events">No input yet</p>
<button id="network">Fetch Network marker</button>
<button id="debug">Debugger breakpoint</button>
<button onclick="window.open('/browser-fixture.html?popup=1','_blank')">Popup tab</button>
<pre id="result"></pre>
<div id="scroll-marker">SCROLL MARKER — browser scrolled, not a static screenshot</div>
<script>
window.liveMarker = crypto.randomUUID();
document.querySelector('#memory').textContent = 'In-memory marker: ' + window.liveMarker;
console.log('HERDR_FIXTURE_READY', window.liveMarker);
const events=[];
let reportTimer;
function report(kind) {
  clearTimeout(reportTimer);
  reportTimer=setTimeout(()=>fetch('/browser-fixture.html?observed='+encodeURIComponent(JSON.stringify({kind,marker:window.liveMarker,draft:document.querySelector('#draft').value.slice(0,4096),scrollY,viewport:[innerWidth,innerHeight],events:events.slice(-8)}))).catch(()=>{}),50);
}
report('load');
addEventListener('input',()=>report('input'));
addEventListener('scroll',()=>report('scroll'));
addEventListener('resize',()=>report('resize'));
for (const kind of ['keydown','keyup','input','wheel']) addEventListener(kind,e=>{
  events.push(kind+':'+(e.key || e.inputType || e.deltaY));
  document.querySelector('#events').textContent=events.slice(-8).join(' | ');
});
document.querySelector('#network').onclick=async()=>{
  const r=await fetch('/browser-fixture.html?network='+encodeURIComponent(window.liveMarker));
  document.querySelector('#result').textContent='Network response '+r.status+' ('+(await r.text()).length+' bytes)';
};
document.querySelector('#debug').onclick=()=>{
  let before=40;
  debugger;
  let after=before+2;
  document.querySelector('#result').textContent='Debugger resumed: '+after;
};
</script>
